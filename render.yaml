services:
  - type: web
    name: free-traffic-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
  envVars:
    - key: PORT
      value: "10000"
    - key: ADMIN_EMAIL
      sync: false
    - key: ADMIN_PASSWORD
      sync: false
    - key: TOKEN_SECRET
      sync: false
    - key: ADMIN_KEY
      sync: false
    - key: REGISTER_CODE
      sync: false
    - key: SECURE_COOKIE
      value: "true"
    - key: OPENAI_API_KEY
      sync: false
    - key: OPENAI_MODEL
      sync: false
    - key: GITHUB_REPO
      value: "winfa2025-ship-it/free-traffic-app"
    - key: GITHUB_BRANCH
      value: "main"
    - key: GITHUB_PAT
      sync: false
