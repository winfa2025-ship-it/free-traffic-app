name: Keep Render Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping admin backend so Render free tier doesn't sleep (optional)
        run: curl -s -o /dev/null -w "HTTP %{http_code}\n" https://free-traffic-app.onrender.com/login || true
