name: Keep Render Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping site so Render free tier never spins down
        run: curl -s -o /dev/null -w "HTTP %{http_code}\n" https://free-traffic-app.onrender.com/ || true
